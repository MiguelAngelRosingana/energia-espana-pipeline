services:
  postgres:
    image: postgres:16
    container_name: energia_postgres
    environment:
      POSTGRES_USER: energia
      POSTGRES_PASSWORD: energia
      POSTGRES_DB: energia
    ports:
      - "5433:5432"          # 5433 en el equipo para no chocar con otro PostgreSQL local
    volumes:
      - ./docker/00_bd_pruebas.sql:/docker-entrypoint-initdb.d/00_bd_pruebas.sql:ro
      - energia_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energia -d energia"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  energia_datos:
