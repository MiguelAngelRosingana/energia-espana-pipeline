name: Ejecución diaria

# Ejecuta el pipeline completo contra la API real de Red Eléctrica en un PostgreSQL
# efímero, comprueba la calidad, deja el resumen en la pestaña del job y publica los CSV
# del modelo como artefacto. Es una demostración de ejecución automática: la base de datos
# no persiste entre ejecuciones, así que cada día recarga una ventana corta.
#
# Ojo: GitHub desactiva los workflows programados tras 60 días sin actividad en el repositorio.

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: energia
          POSTGRES_PASSWORD: energia
          POSTGRES_DB: energia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U energia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://energia:energia@localhost:5432/energia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Comprobar que la fuente sigue cumpliendo el contrato
        run: pytest -m live -q

      - name: Crear esquema
        run: python -m energia init-db

      - name: Cargar los últimos 30 días
        run: |
          DESDE=$(date -u -d "31 days ago" +%F)
          python -m energia run --desde "$DESDE"

      - name: Controles de calidad
        run: python -m energia calidad

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Resumen de la ejecución"
            echo '```'
            python -m energia resumen
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Exportar CSV
        run: python -m energia exportar --destino export

      - uses: actions/upload-artifact@v4
        with:
          name: modelo-csv
          path: export/
          retention-days: 14
