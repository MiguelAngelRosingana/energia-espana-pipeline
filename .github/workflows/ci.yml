name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: energia
          POSTGRES_PASSWORD: energia
          POSTGRES_DB: energia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U energia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://energia:energia@localhost:5432/energia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (unitarios + integración con PostgreSQL real, sin red)
        run: pytest -q
